name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed

permissions: {}

jobs:
  pr-pull:
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'pr-pull') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.id == fromJSON(vars.BREW_AUTOMATION_ACTOR_ID) &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'bump-') &&
        github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha)
    runs-on: ubuntu-latest
    environment: brew-automation
    permissions:
      issues: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BREW_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.BREW_AUTOMATION_PRIVATE_KEY }}

      - name: Add pr-pull label
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: gh pr edit "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --add-label pr-pull

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Pull bottles
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: main

      - name: Delete branch
        if: >-
          github.event_name == 'workflow_run' ||
          github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
        run: git push --delete origin "$BRANCH"
