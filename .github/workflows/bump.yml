name: brew bump

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: brew-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          token: ${{ secrets.HOMEBREW_BUMP_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Open bump pull requests
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: brew bump --formula --open-pr --no-fork --tap="$GITHUB_REPOSITORY"
