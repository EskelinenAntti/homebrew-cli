name: brew bump

on:
  schedule:
    - cron: "36 17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: brew-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: brew-automation
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BREW_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.BREW_AUTOMATION_PRIVATE_KEY }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Open bump pull requests
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
        run: brew bump --formula --open-pr --no-fork --tap="$GITHUB_REPOSITORY"
